<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Important💐</title>
<style>
:root{--bg:#150820;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150820}}
:root[data-theme="dark"]{--bg:#150820}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;touch-action:manipulation}
</style></head><body><canvas id="c"></canvas>
<script>
const TEXT="Chúc mẹ iuu 20-10 vui vẻ và hạnh phúc nhá💖",DELAY=5,CX=500,DY=335,DA=295,DB=165,N=24;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],clamp=v=>v<0?0:v>1?1:v;
const eo=t=>1-(1-t)**3,eb=t=>1+2.70158*(t-1)**3+1.70158*(t-1)**2;
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const g3=(p,t)=>t<.5?mix(p[0],p[1],t*2):mix(p[1],p[2],(t-.5)*2);
const mk=(n,pw)=>{const a=[];for(let i=0;i<=n;i++){const t=i/n;a.push([t,Math.sin(Math.PI*t**pw)])}return a.concat(a.slice(1,-1).reverse().map(([u,v])=>[u,-v]))};
const PET=mk(12,.8),ROSE=mk(14,1.6),LEAF=mk(14,.75);
const RP=[["#f7a1b5","#d8456b","#8f1d3d"],["#ffbca6","#ee6f57","#a83a2c"],["#fbc9d4","#e8708f","#a8305a"],["#ffa3ab","#c9184a","#7a0c2e"]];
const PP=[["#fff3f6","#f9c6d3","#e58fa8"],["#fff6ea","#ffd8bf","#f0a98a"],["#fdf3ff","#e6c8f5","#b98bd9"],["#ffffff","#ffe3ec","#f3b0c4"]];
const LC=["#6b9f7a","#5a8f6b","#4c8664","#86b592","#3f7556"],FC=["#fbc9d4","#f9c6d3","#ffd8bf","#f4a0b8","#ffe3ec"];
const RL=[[6,1,0,.55],[6,.82,.5,.55],[5,.62,1,.55],[4,.42,1.6,.55]];
const PL=[[7,1,0,.5],[7,.86,.45,.5],[6,.7,.9,.5],[5,.52,1.3,.52],[4,.34,1.9,.55]];
let L,stars,flowers,leaves,sprigs,sparks,petals,T0,last,burst;

function petal(sh,x,y,len,w,a,fill,stroke){const c=Math.cos(a),s=Math.sin(a);ctx.beginPath();
 sh.forEach(([u,v],i)=>{const px=u*len,py=v*w,X=x+px*c-py*s,Y=y+px*s+py*c;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});
 ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function pg(pts,fill,stroke,lw){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
 ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke()}
function line(a,b,c,d,col,w){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke()}
function circ(x,y,r,fill,stroke){ctx.beginPath();ctx.arc(x,y,Math.max(r,.1),0,7);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}

function Flower(x,y,r,size,kind,pal,delay){return{x,y,r,size,kind,pal,delay,ph:rnd(0,6.28),sp:rnd(.8,1.25),bx:CX+rnd(-18,18),by:640,cu:rnd(-25,25),rot:rnd(0,6.28),
 j:Array.from({length:6},()=>Array.from({length:8},()=>rnd(-.18,.18))),ly:kind=='rose'?RL:PL}}
function st(f,t){if(t<f.delay)return null;const p=clamp((t-f.delay)/1.8),s=eo(clamp(p/.7)),sw=Math.sin(t*f.sp+f.ph),
 tx=f.x+sw*(3+f.r*5),ty=f.y+Math.cos(t*f.sp*.8+f.ph)*3;return{x:f.bx+(tx-f.bx)*s,y:f.by+(ty-f.by)*s,sw,s,b:eb(clamp((p-.35)/.65))}}
function stem(f,t){const s=st(f,t);if(!s)return;ctx.beginPath();ctx.moveTo(f.bx,f.by);
 ctx.quadraticCurveTo((f.bx+s.x)/2+f.cu*s.s+s.sw*4,(f.by+s.y)/2,s.x,s.y);ctx.strokeStyle="#4f8f63";ctx.lineWidth=f.kind=='daisy'?2:4;ctx.lineCap="round";ctx.stroke()}
function bloom(f,t){const s=st(f,t);if(!s)return;const R=f.size*s.b,x=s.x,y=s.y;
 if(R<5){circ(x,y,5,"#6fa57f");return}
 if(f.kind=='daisy'){for(let k=0;k<13;k++){const a=f.rot+6.283*k/13+s.sw*.05,l=R*(1+.04*Math.sin(t*1.8+f.ph+k));petal(PET,x,y,l,l*.17,a,"#fff","#e6d6e6")}
  circ(x,y,R*.25,"#f6b73c","#d58a14");circ(x-R*.06,y-R*.08,R*.13,"#ffd36b");return}
 const nl=f.ly.length;
 f.ly.forEach(([cnt,lf,off,wf],i)=>{const col=g3(f.pal,i/(nl-1)*.92),base=mix(col,"#3a0a1e",.3),edge=mix(col,"#3a0a1e",.45),tip=mix(col,"#ffffff",.14);
  for(let k=0;k<cnt;k++){const a=f.rot+off+6.283*k/cnt+f.j[i][k]+s.sw*.05*(i+1),len=R*lf*(1+.04*Math.sin(t*1.6+f.ph+k*.9+i));
   const g=ctx.createLinearGradient(x,y,x+Math.cos(a)*len,y+Math.sin(a)*len);g.addColorStop(0,base);g.addColorStop(.55,col);g.addColorStop(1,tip);
   petal(ROSE,x,y,len,len*wf,a,g,edge)}});
 const d=f.pal[2];circ(x,y,R*.17,mix(d,"#000000",.25));circ(x+R*.04,y-R*.03,R*.12,d);circ(x-R*.03,y+R*.03,R*.07,mix(d,f.pal[1],.4))}

function Leaf(tx,ty,d){return{bx:CX+rnd(-15,15),by:600,tx,ty,d,c:pick(LC),ph:rnd(0,6.28)}}
function drawLeaf(l,t){if(t<l.d)return;const g=eo(clamp((t-l.d)/1.6)),a=Math.atan2(l.ty-l.by,l.tx-l.bx)+Math.sin(t+l.ph)*.03,len=Math.hypot(l.tx-l.bx,l.ty-l.by)*g;
 petal(LEAF,l.bx,l.by,len,len*.28,a,l.c,mix(l.c,"#0b3a1c",.45));line(l.bx,l.by,l.bx+Math.cos(a)*len*.9,l.by+Math.sin(a)*len*.9,mix(l.c,"#e8fff0",.4),1)}
function Sprig(tx,ty,d){return{bx:CX+rnd(-15,15),by:610,tx,ty,d,ph:rnd(0,6.28),dots:Array.from({length:9},()=>[rnd(-28,28),rnd(-28,28),rnd(2.2,4)])}}
function drawSprig(p,t){if(t<p.d)return;const g=eo(clamp((t-p.d)/1.6)),sw=Math.sin(t*1.3+p.ph),x=p.bx+(p.tx-p.bx)*g+sw*4,y=p.by+(p.ty-p.by)*g;
 ctx.beginPath();ctx.moveTo(p.bx,p.by);ctx.quadraticCurveTo((p.bx+x)/2,(p.by+y)/2,x,y);ctx.strokeStyle="#7fae8a";ctx.lineWidth=2;ctx.stroke();
 if(g<.6)return;const s=clamp((g-.6)/.4);p.dots.forEach(([dx,dy,r],i)=>{const X=x+dx*s+sw*1.5,Y=y+dy*s;if(i<5)line(x,y,X,Y,"#8dbb98",1);circ(X,Y,r*s,"#fffafc","#f3dfe8")})}

function wrapper(){pg([[318,485],[400,505],[500,481],[600,505],[682,485],[500,725]],"#f3e3d3","#d2b49a",2);
 pg([[345,531],[500,573],[655,531],[500,727]],"#e8a3b5","#c46d88",2);line(500,573,500,727,"#f2c2cf",2);line(345,531,500,727,"#f2b5c4",1);line(655,531,500,727,"#f2b5c4",1);
 pg([[414,613],[586,613],[574,635],[426,635]],"#9b2243","#6e1230");line(420,618,580,618,"#c4476a",1);
 pg([[495,632],[470,692],[488,684],[500,704]],"#b8304f","#6e1230");pg([[505,632],[530,692],[512,684],[500,704]],"#b8304f","#6e1230");
 pg([[500,624],[455,596],[436,616],[456,646]],"#b8304f","#6e1230",2);pg([[500,624],[545,596],[564,616],[544,646]],"#b8304f","#6e1230",2);circ(500,625,13,"#cf4566","#6e1230")}

function spark(big,x,y){sparks.push({x:x??rnd(40,L.w-40),y:y??rnd(10,L.h*.7),born:(performance.now()-T0)/1000,life:rnd(1.2,2.6),size:rnd(8,big?20:14),rot:rnd(0,3),col:pick(["#fff","#ffe9a8","#ffd0e0","#fff3d0"])})}
function star(x,y,r,rot){ctx.beginPath();for(let i=0;i<8;i++){const q=i%2?r*.25:r,a=rot+Math.PI*i/4;ctx.lineTo(x+q*Math.cos(a),y+q*Math.sin(a))}ctx.closePath();ctx.fill()}
function particles(t,dt){if(Math.random()<.6)spark(false,rnd(40,L.w-40),rnd(L.portrait?20:15,L.h*.75));
 sparks=sparks.filter(s=>{const a=(t-s.born)/s.life;if(a>=1)return false;ctx.fillStyle=s.col;star(s.x,s.y,s.size*Math.sin(Math.PI*a)*L.k*(L.portrait?1.3:1),s.rot+a*2);return true});
 if(petals.length<40&&Math.random()<.3)petals.push({x:rnd(0,L.w),y:-20,vx:rnd(-15,15),vy:rnd(40,85),r:rnd(0,6.28),vr:rnd(-2,2),s:rnd(10,20),c:pick(FC),ph:rnd(0,6.28)});
 petals=petals.filter(p=>{p.y+=p.vy*dt;p.x+=(p.vx+Math.sin(t*2+p.ph)*30)*dt;p.r+=p.vr*dt;if(p.y>L.h+30)return false;
  const sq=.35+.65*Math.abs(Math.cos(t*2+p.ph));petal(ROSE,p.x,p.y,p.s,p.s*.55*sq,p.r,p.c);return true})}
function text(tt){const fade=clamp(tt),pulse=.5+.5*Math.sin(tt*7),slow=.55+.45*Math.abs(Math.sin(tt*3.2)),flick=((tt*4|0)%7==6)?.25:1,a=fade*slow*flick;
 const main=mix("#fff6e8","#ffd66b",pulse),glow=mix("#ff7aa8","#ffb36b",.5+.5*Math.sin(tt*2.3));
 const lines=L.portrait?["Chúc mẹ iuu 20-10","vui vẻ và hạnh phúc nhá💖"]:[TEXT];let size=L.portrait?60:40;
 const f=()=>ctx.font=`italic 700 ${size}px "Segoe UI",system-ui,sans-serif`;f();
 while(Math.max(...lines.map(l=>ctx.measureText(l).width))>L.w-50&&size>12){size--;f()}
 ctx.textAlign="center";ctx.textBaseline="middle";ctx.globalAlpha=a;
 lines.forEach((l,i)=>{const y=L.portrait?110+i*size*1.3:55;ctx.shadowColor=glow;ctx.shadowBlur=30;ctx.fillStyle=glow;ctx.fillText(l,L.w/2,y);
  ctx.shadowBlur=10;ctx.fillStyle=main;ctx.fillText(l,L.w/2,y)});ctx.globalAlpha=1;ctx.shadowBlur=0}

function layout(){const por=innerWidth<innerHeight,w=por?760:1000,h=por?1000:740,k=por?.76:1,dpr=Math.min(devicePixelRatio||1,2);
 L={w,h,k,ox:0,oy:por?h-740*k-50:0,portrait:por};cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 cv.style.width=`min(100%, ${Math.floor(innerHeight*w/h)}px)`;cv.style.aspectRatio=w+"/"+h;
 stars=Array.from({length:45},()=>[rnd(5,w-5),rnd(5,h*.8),pick([1,1,2]),rnd(1,3),rnd(0,6.28)])}
function reset(){T0=performance.now();last=T0;burst=0;sparks=[];petals=[];flowers=[];leaves=[];sprigs=[];
 for(let i=0;i<N;i++){const r=Math.sqrt((i+.5)/N),an=i*2.39996323,x=CX+DA*r*Math.cos(an),y=DY+DB*r*Math.sin(an),d=.1+r*2.2+rnd(0,.3);let kind,pal,size;
  if(r>.75&&Math.random()<.55){kind="daisy";pal=null;size=rnd(34,44)}
  else if(Math.random()<.5){kind="rose";pal=pick(RP);size=rnd(62,82)*(1-.1*r)}else{kind="peony";pal=pick(PP);size=rnd(70,90)*(1-.1*r)}
  flowers.push(Flower(x,y,r,size,kind,pal,d))}
 flowers.sort((a,b)=>(a.kind=='daisy')-(b.kind=='daisy')||a.y-b.y);
 for(let k=0;k<18;k++){const th=Math.PI*(.95+1.1*k/17);leaves.push(Leaf(CX+(DA+30)*Math.cos(th),DY+(DB+40)*Math.sin(th),.05+.05*k))}
 for(let k=0;k<14;k++){const th=Math.PI*(.92+1.16*(k+rnd(-.3,.3))/13);sprigs.push(Sprig(CX+(DA+45)*Math.cos(th),DY+(DB+55)*Math.sin(th),.3+.1*k))}}

function frame(now){const t=(now-T0)/1000,dt=Math.min(.1,(now-last)/1000);last=now;
 const g=ctx.createLinearGradient(0,0,0,L.h);g.addColorStop(0,"#150820");g.addColorStop(1,"#5a1a3e");ctx.fillStyle=g;ctx.fillRect(0,0,L.w,L.h);
 const gx=L.ox+CX*L.k,gy=L.oy+340*L.k,rg=ctx.createRadialGradient(gx,gy,0,gx,gy,440*L.k);rg.addColorStop(0,"rgba(255,176,200,.26)");rg.addColorStop(1,"rgba(255,176,200,0)");ctx.fillStyle=rg;ctx.fillRect(0,0,L.w,L.h);
 stars.forEach(s=>{ctx.globalAlpha=.25+.6*(.5+.5*Math.sin(t*s[3]+s[4]));circ(s[0],s[1],s[2],"#ffe9f0")});ctx.globalAlpha=1;
 ctx.save();ctx.translate(L.ox,L.oy);ctx.scale(L.k,L.k);
 leaves.forEach(l=>drawLeaf(l,t));sprigs.forEach(p=>drawSprig(p,t));flowers.forEach(f=>stem(f,t));wrapper();flowers.forEach(f=>bloom(f,t));ctx.restore();
 const tt=t-DELAY;
 if(tt>=0){if(!burst){burst=1;const cy=L.portrait?135:55;for(let i=0;i<80;i++)spark(true,L.w/2+rnd(-L.w*.4,L.w*.4),cy+rnd(-40,40))}particles(t,dt);text(tt)}
 requestAnimationFrame(frame)}
addEventListener("resize",layout);addEventListener("pointerdown",reset);
addEventListener("keydown",e=>{if(e.key==" "||e.key=="r")reset()});
layout();reset();requestAnimationFrame(frame);
</script></body></html>
